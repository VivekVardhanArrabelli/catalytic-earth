name: P0 contracts

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: p0-contracts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      # actions/checkout documents that its filter input overrides its sparse
      # input. Clone without checkout, set sparse paths, then materialize only
      # the requested ref so the artifact tree is never fetched into worktree.
      - name: Blob-filtered sparse checkout
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout --no-tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          git sparse-checkout init --cone
          git sparse-checkout set \
            .github config data/atlas data/diagnostics data/governance docs environments release \
            requirements scripts src tests
          git fetch --no-tags --filter=blob:none origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Prove blob-filtered sparse checkout
        shell: python
        run: |
          import pathlib
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          assert git("config", "--get", "remote.origin.promisor") == "true"
          assert git("config", "--bool", "core.sparseCheckout") == "true"
          assert not pathlib.Path("artifacts").exists()
          print("partial clone and sparse worktree are active")

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/build.lock

      - name: Install locked build tools
        run: python -m pip install --disable-pip-version-check -r requirements/build.lock

      - name: Validate governance, registry, manifests, docs, and path safety
        env:
          CE_PARTIAL_CLONE: "1"
          # Compare review evidence with the PR base/previous push, so a
          # committed deletion or rewrite cannot hide behind a clean HEAD.
          CE_REVIEW_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/validate_repository_contracts.py

      - name: Run core/unit tier
        run: python scripts/run_test_tier.py "core/unit"

      - name: Build current Atlas-3 wheel
        run: python -m build --wheel --no-isolation --outdir dist-atlas3

      - name: Verify Atlas-3 wheel and query from an empty directory
        run: python scripts/verify_atlas3_release.py --wheel dist-atlas3

      - name: Verify Atlas-10 and source drafts from an empty directory
        run: python scripts/verify_atlas10_release.py --wheel dist-atlas3 --include-source-drafts

      - name: Build wheel and lean archive from the exact release source commit
        run: python scripts/build_canonical_release_assets.py

      - name: Verify wheel and source archive from empty directories
        run: >-
          python scripts/verify_core_release.py
          --wheel dist
          --source-archive dist/catalytic-earth-0.1.0-lean-source.zip

      - name: Check wheel and archive size ceiling
        shell: python
        run: |
          from pathlib import Path
          assets = [*Path("dist").glob("*.whl"), *Path("dist").glob("*-lean-source.zip")]
          assert len(assets) == 2, assets
          for asset in assets:
              assert asset.stat().st_size < 100 * 1024 * 1024, (asset, asset.stat().st_size)
              print(asset, asset.stat().st_size)
